<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Rei dos Piratas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 400px; background-color: #181825; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 80vh; overflow: hidden; border: 1px solid #313244; }
        #chat-header { background-color: #f38ba8; color: #11111b; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        #chat-history { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-msg { background-color: #89b4fa; color: #11111b; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background-color: #313244; color: #cdd6f4; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-container { display: flex; padding: 10px; background-color: #181825; border-top: 1px solid #313244; }
        #chat-input { flex: 1; padding: 12px; border: none; border-radius: 8px; background-color: #313244; color: #cdd6f4; outline: none; }
        #send-btn { background-color: #f38ba8; color: #11111b; border: none; border-radius: 8px; padding: 0 20px; margin-left: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #send-btn:hover { background-color: #eba0ac; }
        .loading { font-style: italic; color: #a6adc8; font-size: 0.85rem; align-self: flex-start; margin-left: 10px; display: none; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">⚓ Nakama Bot - Rei dos Piratas</div>
    <div id="chat-history">
        <div class="message bot-msg">Ahoy! Sou o assistente do Rei dos Piratas. Como posso te ajudar a encontrar seu mangá hoje?</div>
    </div>
    <div id="loading" class="loading">Pensando...</div>
    <div id="input-container">
        <input type="text" id="chat-input" placeholder="Digite sua dúvida..." autocomplete="off" onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    const chatHistory = document.getElementById('chat-history');
    const chatInput = document.getElementById('chat-input');
    const loading = document.getElementById('loading');

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // Adiciona a mensagem do usuário na tela
        appendMessage(text, 'user-msg');
        chatInput.value = '';
        loading.style.display = 'block';
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            // Faz a requisição POST para a sua própria API
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (response.ok) {
                appendMessage(data.reply, 'bot-msg');
            } else {
                appendMessage('Erro: ' + (data.detail || 'Falha na comunicação.'), 'bot-msg');
            }
        } catch (error) {
            appendMessage('Erro de conexão com o servidor.', 'bot-msg');
        } finally {
            loading.style.display = 'none';
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatHistory.appendChild(msgDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
