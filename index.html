<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rei dos Piratas — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:        #e8b84b;
      --gold-bright: #f5d17a;
      --gold-dim:    rgba(232,184,75,0.12);
      --cyan:        #4fd1c5;
      --cyan-dim:    rgba(79,209,197,0.1);
      --bg:          #05080f;
      --surface:     rgba(8,14,28,0.88);
      --surface-bot: rgba(10,18,36,0.92);
      --text:        #e4e0d5;
      --text-dim:    #687080;
      --border:      rgba(232,184,75,0.18);
      --border-hi:   rgba(232,184,75,0.42);
    }

    html, body { height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Canvas bg ─────────────────────────────── */
    #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── App shell ─────────────────────────────── */
    #app {
      position: relative; z-index: 1;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; padding: 16px;
    }

    #chat-box {
      width: 100%; max-width: 640px;
      height: min(92vh, 860px);
      display: flex; flex-direction: column;
      background: var(--surface);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 22px;
      border: 1px solid var(--border-hi);
      box-shadow:
        0 0 0 1px rgba(232,184,75,0.04),
        0 24px 70px rgba(0,0,0,0.75),
        0 0 120px rgba(232,184,75,0.04),
        inset 0 1px 0 rgba(255,255,255,0.03);
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    #hdr {
      position: relative;
      padding: 18px 22px;
      background: linear-gradient(180deg, rgba(18,10,2,0.97) 0%, rgba(8,13,24,0.92) 100%);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      overflow: hidden; flex-shrink: 0;
    }

    /* gold shimmer top-line */
    #hdr::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--gold-bright) 50%, var(--gold) 60%, transparent 100%);
      background-size: 200% 100%;
      animation: hdr-shimmer 3s linear infinite;
    }

    @keyframes hdr-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* scanlines */
    #hdr::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
      pointer-events: none;
    }

    .logo-icon {
      width: 50px; height: 50px; flex-shrink: 0;
      position: relative; z-index: 1;
    }

    .logo-icon svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 8px rgba(232,184,75,0.55));
      animation: icon-pulse 2.8s ease-in-out infinite;
    }

    @keyframes icon-pulse {
      0%,100% { filter: drop-shadow(0 0 6px rgba(232,184,75,0.45)); }
      50%      { filter: drop-shadow(0 0 18px rgba(232,184,75,0.95)); }
    }

    .hdr-text { flex: 1; position: relative; z-index: 1; }

    .hdr-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.05rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-shadow: 0 0 24px rgba(232,184,75,0.55);
    }

    .hdr-status {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 4px;
      display: flex; align-items: center; gap: 7px;
    }

    .dot-live {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 7px #4ade80;
      animation: blink 2.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* ── Messages ─────────────────────────────────── */
    #msgs {
      flex: 1; padding: 22px 18px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(232,184,75,0.2) transparent;
    }

    #msgs::-webkit-scrollbar { width: 3px; }
    #msgs::-webkit-scrollbar-thumb { background: rgba(232,184,75,0.2); border-radius: 6px; }

    .msg-wrap {
      display: flex; flex-direction: column; gap: 3px;
      animation: pop-in 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards;
      opacity: 0; transform: translateY(14px) scale(0.96);
    }

    .msg-wrap.u { align-items: flex-end; }
    .msg-wrap.b { align-items: flex-start; }

    @keyframes pop-in { to { opacity: 1; transform: translateY(0) scale(1); } }

    .msg-lbl {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem; letter-spacing: 0.18em;
      color: var(--text-dim); text-transform: uppercase; padding: 0 5px;
    }

    .bubble {
      max-width: 80%; padding: 12px 17px;
      border-radius: 17px; font-size: 0.91rem; line-height: 1.7;
      word-wrap: break-word; position: relative;
    }

    /* user bubble */
    .bubble.u {
      background: linear-gradient(135deg, var(--gold) 0%, #c9922a 100%);
      color: #1a0e00; font-weight: 500;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 22px rgba(232,184,75,0.28),
                  inset 0 1px 0 rgba(255,255,255,0.22);
    }

    /* bot bubble */
    .bubble.b {
      background: var(--surface-bot);
      color: var(--text);
      border-bottom-left-radius: 3px;
      border: 1px solid rgba(79,209,197,0.18);
      box-shadow: 0 4px 22px rgba(0,0,0,0.35),
                  0 0 0 1px rgba(79,209,197,0.04);
    }

    /* cyan left-bar */
    .bubble.b::before {
      content: '';
      position: absolute; left: -1px; top: 18%; bottom: 18%;
      width: 2px;
      background: linear-gradient(180deg, transparent, var(--cyan), transparent);
      border-radius: 2px;
    }

    /* ── Markdown rendering inside bot bubble ── */
    .bubble.b strong, .bubble.b b { color: var(--gold-bright); font-weight: 600; }
    .bubble.b em, .bubble.b i     { color: var(--cyan); font-style: italic; }

    .bubble.b p { margin-bottom: 8px; }
    .bubble.b p:last-child { margin-bottom: 0; }

    .bubble.b ul,
    .bubble.b ol {
      padding-left: 20px;
      margin: 6px 0 8px;
    }
    .bubble.b ul { list-style: disc; }
    .bubble.b ol { list-style: decimal; }
    .bubble.b li {
      display: list-item;
      margin-bottom: 4px;
      padding-left: 2px;
    }
    .bubble.b li:last-child { margin-bottom: 0; }

    .bubble.b h1, .bubble.b h2, .bubble.b h3,
    .bubble.b h4, .bubble.b h5, .bubble.b h6 {
      font-family: 'Cinzel', serif;
      color: var(--gold-bright);
      margin: 10px 0 5px;
      font-weight: 600;
      line-height: 1.3;
    }
    .bubble.b h1 { font-size: 1.1em; }
    .bubble.b h2 { font-size: 1.0em; }
    .bubble.b h3 { font-size: 0.95em; }

    .bubble.b a {
      color: var(--cyan);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .bubble.b a:hover { opacity: 0.8; }

    .bubble.b code {
      background: rgba(79,209,197,0.1); color: var(--cyan);
      padding: 1px 6px; border-radius: 4px; font-size: 0.83em;
      font-family: 'Courier New', monospace;
    }
    .bubble.b pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(79,209,197,0.15);
      border-radius: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble.b pre code {
      background: none; padding: 0; font-size: 0.82em; color: var(--cyan);
    }

    .bubble.b blockquote {
      border-left: 3px solid var(--gold);
      margin: 8px 0;
      padding: 4px 0 4px 12px;
      color: rgba(228,224,213,0.7);
      font-style: italic;
    }

    .bubble.b hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    .bubble.b table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 0.88em;
    }
    .bubble.b th {
      background: rgba(232,184,75,0.1);
      color: var(--gold-bright);
      font-family: 'Cinzel', serif;
      font-size: 0.8em;
      letter-spacing: 0.08em;
      padding: 6px 10px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .bubble.b td {
      padding: 6px 10px;
      border: 1px solid rgba(232,184,75,0.1);
    }
    .bubble.b tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    /* ── Typing indicator ─────────────────────────── */
    #typing-wrap {
      padding: 0 18px 2px;
      display: flex; gap: 0;
      animation: fade-up 0.25s ease forwards;
      opacity: 0; transform: translateY(6px);
    }

    @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }

    #typing-bbl {
      background: var(--surface-bot);
      border: 1px solid rgba(79,209,197,0.18);
      padding: 13px 17px; border-radius: 17px; border-bottom-left-radius: 3px;
      display: flex; align-items: center; gap: 5px;
    }

    #typing-bbl span {
      width: 6px; height: 6px;
      background: var(--cyan); border-radius: 50%; opacity: 0.6;
      animation: wave 1.4s ease-in-out infinite;
    }
    #typing-bbl span:nth-child(2) { animation-delay: 0.14s; }
    #typing-bbl span:nth-child(3) { animation-delay: 0.28s; }

    @keyframes wave {
      0%,60%,100% { transform: translateY(0); opacity: 0.5; }
      30%         { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ───────────────────────────────── */
    #input-area {
      padding: 13px 16px 18px;
      background: linear-gradient(0deg, rgba(4,6,12,0.97) 0%, rgba(8,14,28,0.85) 100%);
      border-top: 1px solid var(--border);
      position: relative; flex-shrink: 0;
    }

    /* faint cyan top-line */
    #input-area::before {
      content: '';
      position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(79,209,197,0.25), transparent);
    }

    #input-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(10,17,34,0.82);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 6px 6px 20px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    #input-row:focus-within {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px rgba(232,184,75,0.07), 0 0 24px rgba(232,184,75,0.08);
    }

    #chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.91rem;
      caret-color: var(--gold);
    }
    #chat-input::placeholder { color: rgba(104,112,128,0.6); }
    #chat-input:disabled { opacity: 0.45; cursor: not-allowed; }

    #send-btn {
      width: 46px; height: 46px;
      border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--gold) 0%, #c08020 100%);
      color: #180e00;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      box-shadow: 0 2px 14px rgba(232,184,75,0.35);
    }

    #send-btn:hover:not(:disabled) {
      transform: scale(1.12) rotate(12deg);
      box-shadow: 0 4px 22px rgba(232,184,75,0.6);
    }
    #send-btn:active:not(:disabled) { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Welcome divider ──────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Cinzel', serif;
      font-size: 0.62rem; letter-spacing: 0.2em; color: var(--text-dim);
      text-transform: uppercase; padding: 0 4px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border));
    }
    .divider::after { background: linear-gradient(270deg, transparent, var(--border)); }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="app">
  <div id="chat-box">

    <div id="hdr">
      <div class="logo-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="24" cy="20" rx="12" ry="13" fill="rgba(232,184,75,0.08)" stroke="#e8b84b" stroke-width="1.4"/>
          <ellipse cx="19.5" cy="17.5" rx="3.2" ry="3.5" fill="#e8b84b"/>
          <ellipse cx="28.5" cy="17.5" rx="3.2" ry="3.5" fill="#e8b84b"/>
          <ellipse cx="19.5" cy="17.5" rx="1.4" ry="1.6" fill="#06090f"/>
          <ellipse cx="28.5" cy="17.5" rx="1.4" ry="1.6" fill="#06090f"/>
          <path d="M22 22 L24 24.5 L26 22" stroke="#e8b84b" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
          <path d="M19 26 Q24 30 29 26" stroke="#e8b84b" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <line x1="22" y1="26.5" x2="22" y2="29.5" stroke="#e8b84b" stroke-width="1" stroke-linecap="round"/>
          <line x1="24" y1="27" x2="24" y2="30"   stroke="#e8b84b" stroke-width="1" stroke-linecap="round"/>
          <line x1="26" y1="26.5" x2="26" y2="29.5" stroke="#e8b84b" stroke-width="1" stroke-linecap="round"/>
          <line x1="7"  y1="35" x2="41" y2="45" stroke="#e8b84b" stroke-width="2" stroke-linecap="round"/>
          <line x1="41" y1="35" x2="7"  y2="45" stroke="#e8b84b" stroke-width="2" stroke-linecap="round"/>
          <circle cx="7"  cy="35" r="2.6" fill="#e8b84b"/>
          <circle cx="41" cy="35" r="2.6" fill="#e8b84b"/>
          <circle cx="7"  cy="45" r="2.6" fill="#e8b84b"/>
          <circle cx="41" cy="45" r="2.6" fill="#e8b84b"/>
        </svg>
      </div>
      <div class="hdr-text">
        <div class="hdr-name">Takamura Bot</div>
        <div class="hdr-status">
          <span class="dot-live"></span>
          Navegando a Grand Line
        </div>
      </div>
    </div>

    <div id="msgs"></div>

    <div id="input-area">
      <form id="input-row">
        <input type="text" id="chat-input" placeholder="Qual mangá você procura, pirata?..." autocomplete="off">
        <button type="submit" id="send-btn" aria-label="Enviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </div>

  </div>
</div>

<script>
/* ── Canvas particles ─────────────────────────── */
(function() {
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  let W, H, pts = [];

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }

  class Pt {
    constructor(init) {
      this.x = Math.random() * (W || 800);
      this.y = init ? Math.random() * (H || 600) : (H || 600) + 10;
      this.r = Math.random() * 1.4 + 0.3;
      this.vy = Math.random() * 0.35 + 0.08;
      this.vx = (Math.random() - 0.5) * 0.25;
      this.a  = Math.random() * 0.35 + 0.05;
      this.c  = Math.random() > 0.55 ? '#e8b84b' : '#4fd1c5';
    }
    tick() {
      this.y -= this.vy; this.x += this.vx;
      if (this.y < -5) Object.assign(this, new Pt(false));
    }
    draw() {
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      cx.fillStyle = this.c;
      cx.globalAlpha = this.a;
      cx.fill();
    }
  }

  function init() { pts = Array.from({length: 90}, (_, i) => new Pt(true)); }

  function frame() {
    cx.clearRect(0, 0, W, H);
    // deep ocean gradient
    const g = cx.createRadialGradient(W*.5, H*.25, 0, W*.5, H*.6, H*.9);
    g.addColorStop(0, 'rgba(9,18,46,0.65)');
    g.addColorStop(1, 'rgba(2,4,10,0.92)');
    cx.globalAlpha = 1;
    cx.fillStyle = g;
    cx.fillRect(0, 0, W, H);
    pts.forEach(p => { p.tick(); p.draw(); });
    cx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', () => { resize(); init(); });
  init();
  frame();
})();

/* ── Chat ─────────────────────────────────────── */
const msgs     = document.getElementById('msgs');
const inputRow = document.getElementById('input-row');
const input    = document.getElementById('chat-input');
const btn      = document.getElementById('send-btn');

// Gera um ID de sessão único pro Redis quando o usuário abre a tela
const sessionId = Math.random().toString(36).substring(2, 15);

if (typeof marked !== 'undefined') marked.use({ breaks: true, gfm: true });

// typing indicator (created once, moved in/out)
const typingWrap = document.createElement('div');
typingWrap.id = 'typing-wrap';
typingWrap.innerHTML = '<div id="typing-bbl"><span></span><span></span><span></span></div>';

// welcome
addDivider('Grand Line · Início da Jornada');
appendMsg('Ahoy! Sou o assistente do **Rei dos Piratas**. Como posso te ajudar a encontrar seu mangá hoje? ☠️', 'b', true);

// MUDANÇA AQUI: Único evento escutando o submit do Form (resolve o Enter 100%)
inputRow.addEventListener('submit', e => {
  e.preventDefault();
  if (!btn.disabled) send();
});

async function send() {
  const txt = input.value.trim();
  if (!txt) return;
  appendMsg(txt, 'u', false);
  input.value = '';
  setUI(true);

  try {
    const res  = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // MUDANÇA AQUI: Enviando o session_id no payload
      body: JSON.stringify({ message: txt, session_id: sessionId })
    });
    const data = await res.json();
    appendMsg(res.ok ? data.reply : '**Erro:** ' + (data.detail || 'Falha na comunicação.'), 'b', true);
  } catch(e) {
    appendMsg('**Erro crítico:** Falha ao conectar com os servidores da Grand Line.', 'b', true);
  } finally {
    setUI(false);
    scrollEnd();
    input.focus();
  }
}

function appendMsg(text, who, md) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + who;

  const lbl = document.createElement('div');
  lbl.className = 'msg-lbl';
  lbl.textContent = who === 'u' ? 'Você' : 'Takamura';

  const bbl = document.createElement('div');
  bbl.className = 'bubble ' + who;
  bbl.innerHTML = (md && typeof marked !== 'undefined') ? marked.parse(text) : escHtml(text);

  wrap.appendChild(lbl);
  wrap.appendChild(bbl);

  if (typingWrap.parentNode === msgs) msgs.insertBefore(wrap, typingWrap);
  else msgs.appendChild(wrap);
  scrollEnd();
}

function addDivider(label) {
  const d = document.createElement('div');
  d.className = 'divider';
  d.textContent = label;
  msgs.appendChild(d);
}

function setUI(loading) {
  input.disabled = btn.disabled = loading;
  if (loading) {
    msgs.appendChild(typingWrap);
    // re-trigger animation
    typingWrap.style.animation = 'none';
    typingWrap.offsetHeight;
    typingWrap.style.animation = '';
    scrollEnd();
  } else if (typingWrap.parentNode === msgs) {
    msgs.removeChild(typingWrap);
  }
}

function scrollEnd() { msgs.scrollTop = msgs.scrollHeight; }

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
