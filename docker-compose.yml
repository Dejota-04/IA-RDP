version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: ia-redis
    ports:
      - "6379:6379"

  ia-api:
    build: .
    container_name: ia-rdp
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0